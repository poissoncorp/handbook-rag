<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Handbook assistant</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.10.2/dist/driver.css">
    <link rel="stylesheet" href="app.css">
    <script type="module" src="app.js"></script>
</head>
<body>
<header>
    <nav class="container">
        <ul>
            <li><a href="#ask" class="brand"><strong>Handbook assistant</strong> <small>RAG on RavenDB</small></a></li>
        </ul>
        <ul>
            <li class="switch">
                <a href="#ask">Ask</a>
                <a href="#search">Search</a>
            </li>
            <li><button id="explain" type="button" class="secondary outline" aria-label="How it works"><span>How it works</span></button></li>
            <li><details id="user" class="dropdown"><summary aria-busy="true"></summary><ul></ul></details></li>
        </ul>
    </nav>
</header>
<main class="container">
    <section id="ask-view">
        <div id="messages"></div>
        <form id="ask">
            <fieldset role="group">
                <input name="prompt" placeholder="Ask about the handbook" autocomplete="off" required>
                <button type="submit">Ask</button>
            </fieldset>
        </form>
        <button id="new-conversation" class="secondary outline" hidden>New conversation</button>
    </section>
    <section id="search-view" hidden>
        <form id="search">
            <fieldset role="group">
                <input type="search" name="q" placeholder="Describe what you are looking for" autocomplete="off" required>
                <button type="submit">Search</button>
            </fieldset>
        </form>
        <div id="results"></div>
        <details id="rql" hidden>
            <summary>Show the query that ran</summary>
            <pre><code></code></pre>
        </details>
    </section>
</main>
</body>
</html>
